# nginx-конфиг для simpleprj.sbs
# Путь к проекту на сервере: /opt/manga-django (если другой - поправь ниже)
#
# Установка:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/simpleprj.sbs
#   sudo ln -sf /etc/nginx/sites-available/simpleprj.sbs /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name simpleprj.sbs www.simpleprj.sbs;

    # Загрузка глав/обложек (nginx по умолчанию режет запросы больше 1m!)
    client_max_body_size 200m;

    # Собранные статические файлы (manage.py collectstatic)
    location /static/ {
        alias /opt/manga-django/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Загруженные картинки, аватары, главы манги
    location /media/ {
        alias /opt/manga-django/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Всё остальное отдаёт Django (gunicorn)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
