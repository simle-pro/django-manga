<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавить тайтл — MangaLib</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; }
        .form-box { max-width: 600px; margin: 30px auto; background: #1e1e1e; padding: 25px; border-radius: 8px; }
        input[type="text"], textarea, select { width: 100%; padding: 8px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; box-sizing: border-box; }
        button { background: #e50914; color: #fff; border: none; padding: 12px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; width: 100%; margin-top: 15px; }
        
        /* Сетка для чекбоксов жанров */
        .genre-checkboxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; list-style: none; padding: 0; margin-top: 5px; }
        .genre-checkboxes li label { font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 5px; background: #2a2a2a; padding: 6px 10px; border-radius: 4px; border: 1px solid #333; }
        .genre-checkboxes li label:hover { background: #333; }
    </style>
</head>
<body>
    <div class="form-box">
        <a href="{% url 'home' %}" style="color: #aaa; text-decoration: none;">← На главную</a>
        <h2>Добавление нового тайтла</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Создать тайтл</button>
        </form>
    </div>
</body>
</html>
