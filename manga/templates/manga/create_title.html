{% extends 'manga/base.html' %}

{% block title %}Создание тайтла — MangaSpace{% endblock %}

{% block content %}
<style>
    .form-container {
        max-width: 680px;
        margin: 30px auto;
        background: var(--bg-surface);
        border: 1px solid var(--border-highlight);
        border-radius: var(--radius-lg);
        padding: 32px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .form-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 16px;
    }

    .form-title {
        font-size: 1.5rem;
        font-weight: 800;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
    }

    .form-title i {
        color: var(--accent);
    }

    .back-link {
        color: var(--text-muted);
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: var(--transition);
    }

    .back-link:hover {
        color: var(--accent);
    }

    .form-body p {
        margin-bottom: 18px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .form-body label {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text-main);
    }

    .form-body input[type="text"],
    .form-body input[type="number"],
    .form-body select,
    .form-body textarea {
        width: 100%;
        padding: 12px 16px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        color: #fff;
        font-size: 0.95rem;
        outline: none;
        transition: var(--transition);
        box-sizing: border-box;
    }

    .form-body textarea {
        min-height: 120px;
        resize: vertical;
    }

    .form-body input:focus,
    .form-body select:focus,
    .form-body textarea:focus {
        background: rgba(0, 0, 0, 0.3);
        border-color: var(--accent);
        box-shadow: 0 0 15px var(--accent-glow);
    }

    .form-body ul {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 10px;
        list-style: none;
        padding: 0;
        margin: 8px 0 0 0;
    }

    .form-body ul li label {
        font-size: 0.85rem;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.03);
        padding: 8px 12px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-color);
        transition: var(--transition);
    }

    .form-body ul li label:hover {
        background: rgba(255, 42, 95, 0.1);
        border-color: var(--accent);
    }

    .form-body ul li input[type="checkbox"] {
        accent-color: var(--accent);
        width: 16px;
        height: 16px;
        cursor: pointer;
    }

    .form-body input[type="file"] {
        padding: 8px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px dashed var(--border-highlight);
        border-radius: var(--radius-md);
        color: var(--text-muted);
        cursor: pointer;
    }

    .submit-btn {
        width: 100%;
        margin-top: 24px;
        padding: 14px;
        font-size: 1rem;
        font-weight: 700;
    }
</style>

<div class="form-container">
    <div class="form-header">
        <h2 class="form-title">
            <i class="fa-solid fa-square-plus"></i> Создание тайтла
        </h2>
        <a href="{% url 'home' %}" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> На главную
        </a>
    </div>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-body">
            {{ form.as_p }}
        </div>
        
        <button type="submit" class="btn btn-primary submit-btn">
            <i class="fa-solid fa-check"></i> Создать тайтл
        </button>
    </form>
</div>
{% endblock %}
