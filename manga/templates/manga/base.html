<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MangaLib Lite{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Шапка */
        header {
            background-color: #1f1f1f;
            border-bottom: 1px solid #333;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.4em;
            font-weight: bold;
            color: #e50914;
            text-decoration: none;
            white-space: nowrap;
        }

        .search-bar {
            flex: 1;
            max-width: 400px;
        }
        .search-bar input {
            width: 100%;
            padding: 8px 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            outline: none;
        }

        .nav-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .nav-links a {
            color: #ccc;
            text-decoration: none;
            font-size: 0.95em;
        }
        .nav-links a:hover { color: #fff; }

        .btn {
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9em;
            border: none;
            cursor: pointer;
            display: inline-block;
            text-align: center;
        }
        .btn-primary { background: #e50914; color: white; }
        .btn-secondary { background: #333; color: white; }
        .btn-success { background: #28a745; color: white; }

        /* Кнопка гамбургер-меню для телефонов */
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.8em;
            cursor: pointer;
            padding: 0;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* Адаптивность для телефонов (экраны до 768px) */
        @media (max-width: 768px) {
            .mobile-menu-btn { display: block; }
            
            .nav-container {
                display: none; /* Скрываем на мобилках до нажатия кнопки */
                flex-direction: column;
                position: absolute;
                top: 60px;
                left: 0;
                right: 0;
                background: #1f1f1f;
                padding: 15px 20px;
                border-bottom: 1px solid #333;
                box-shadow: 0 10px 15px rgba(0,0,0,0.5);
                gap: 12px;
                align-items: stretch;
            }

            .nav-container.active { display: flex; }
            .nav-links { flex-direction: column; align-items: stretch; }
            .search-bar { max-width: 100%; width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <a href="{% url 'home' %}" class="logo">MangaLib</a>

        <button class="mobile-menu-btn" onclick="toggleMobileMenu()">☰</button>

        <div class="nav-container" id="mobileNav">
            <div class="nav-links">
                <a href="{% url 'home' %}">Главная</a>
                <a href="{% url 'catalog' %}">Каталог</a>
            </div>

            <div class="search-bar">
                <form action="{% url 'catalog' %}" method="get">
                    <input type="text" name="q" placeholder="Поиск манги..." value="{{ query|default:'' }}">
                </form>
            </div>

            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                {% if user.is_authenticated %}
                    {% if user.role in 'author,admin' or user.is_superuser %}
                        <a href="{% url 'create_title' %}" class="btn btn-success">+ Тайтл</a>
                    {% endif %}
                    <a href="{% url 'my_bookmarks' %}" class="btn btn-secondary">🔖 {{ user.username }}</a>
                    <a href="{% url 'logout' %}" class="btn" style="color: #aaa; background: transparent;">Выйти</a>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-secondary">Войти</a>
                    <a href="{% url 'register' %}" class="btn btn-primary">Регистрация</a>
                {% endif %}
            </div>
        </div>
    </header>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <!-- JS для переключения мобильного меню -->
    <script>
        function toggleMobileMenu() {
            const nav = document.getElementById('mobileNav');
            nav.classList.toggle('active');
        }
    </script>
</body>
</html>
