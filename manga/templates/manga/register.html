{% extends 'manga/base.html' %}

{% block title %}Регистрация — MangaSpace{% endblock %}

{% block content %}
<style>
    .auth-container {
        max-width: 460px;
        margin: 40px auto;
        background: var(--bg-surface);
        border: 1px solid var(--border-highlight);
        border-radius: var(--radius-lg);
        padding: 36px 32px;
        box-shadow: var(--shadow-lg);
    }

    .auth-header {
        text-align: center;
        margin-bottom: 28px;
    }

    .auth-header i {
        font-size: 2.5rem;
        color: var(--accent-text);
        margin-bottom: 12px;
        filter: drop-shadow(0 0 10px var(--accent-glow));
    }

    .auth-title {
        font-size: 1.6rem;
        font-weight: 800;
        color: var(--text-main);
    }

    .auth-subtitle {
        font-size: 0.88rem;
        color: var(--text-muted);
        margin-top: 6px;
    }

    .form-body p {
        margin-bottom: 18px;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .form-body label {
        font-size: 0.88rem;
        font-weight: 600;
        color: var(--text-main);
    }

    .form-body input[type="text"],
    .form-body input[type="password"],
    .form-body input[type="email"],
    .form-body input[type="date"],
    .form-body select {
        width: 100%;
        padding: 12px 16px;
        background: var(--fill-1);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        color: var(--text-main);
        font-size: 0.95rem;
        outline: none;
        transition: var(--transition);
        box-sizing: border-box;
    }

    .form-body input:focus,
    .form-body select:focus {
        background: var(--input-bg-focus);
        border-color: var(--accent);
        box-shadow: 0 0 15px var(--accent-glow);
    }

    .form-body .helptext {
        font-size: 0.78rem;
        color: var(--text-muted);
        line-height: 1.4;
        display: block;
        margin-top: 2px;
    }

    .form-body ul.errorlist {
        list-style: none;
        padding: 0;
        margin: 4px 0 0 0;
        color: var(--accent-2);
        font-size: 0.82rem;
    }

    /* Выбор роли (радиокнопки) */
    .form-body ul.role-options {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        gap: 10px;
    }

    .form-body ul.role-options li {
        flex: 1;
    }

    .form-body ul.role-options label {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px;
        background: var(--fill-1);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: var(--transition);
        color: var(--text-main);
        font-weight: 600;
        font-size: 0.88rem;
    }

    .form-body ul.role-options label:hover {
        border-color: var(--accent);
        background: rgba(var(--accent-rgb), 0.06);
    }

    .form-body ul.role-options input[type="radio"] {
        accent-color: var(--accent);
        width: auto;
        padding: 0;
        margin: 0;
    }

    .form-body ul.role-options input[type="radio"]:checked + span {
        color: var(--accent-text);
    }

    .auth-btn {
        width: 100%;
        margin-top: 10px;
        padding: 13px;
        font-size: 0.98rem;
        font-weight: 700;
    }

    .auth-footer {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid var(--border-color);
        text-align: center;
        font-size: 0.9rem;
        color: var(--text-muted);
    }

    .auth-footer a {
        color: var(--accent-text);
        text-decoration: none;
        font-weight: 600;
        transition: var(--transition);
    }

    .auth-footer a:hover {
        color: var(--accent-2);
        text-decoration: underline;
    }
</style>

<div class="auth-container">
    <div class="auth-header">
        <i class="fa-solid fa-user-plus"></i>
        <h2 class="auth-title">Создать аккаунт</h2>
        <p class="auth-subtitle">Присоединяйтесь к читателям MangaSpace</p>
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="form-body">
            {{ form.as_p }}
        </div>

        <button type="submit" class="btn btn-primary auth-btn">
            Зарегистрироваться
        </button>
    </form>

    <div class="auth-footer">
        Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a>
    </div>
</div>
{% endblock %}
